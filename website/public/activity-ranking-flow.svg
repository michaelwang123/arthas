<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Activity Ranking — Hub Room Sort Flow</title>
  <desc id="svg-desc">Diagram showing how Arthas Hub sorts rooms by activity (5-minute sliding window), member count, or recency, with a global online count indicator.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#0f1019"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2f45"/>
      <stop offset="100%" stop-color="#1e2035"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6366f1"/>
    </marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes dash-flow { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      @keyframes pulse-glow { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 6px rgba(99,102,241,0.6)); } }
      @keyframes arrow-flow { 0%,100% { opacity:0.5; } 50% { opacity:1; } }
      @keyframes dot-pulse { 0%,100% { opacity:0.6; filter: none; } 50% { opacity:1; filter: drop-shadow(0 0 4px rgba(34,197,94,0.8)); } }
      .flow-arrow { animation: arrow-flow 1.5s ease-in-out infinite; }
      .dash-line { stroke-dasharray: 8,4; animation: dash-flow 1s linear infinite; }
      .pulse-card { animation: pulse-glow 3s ease-in-out infinite; }
      .online-dot { animation: dot-pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow-arrow, .dash-line, .pulse-card, .online-dot { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Activity Ranking — Hub Room Sort Flow</text>

  <!-- ===== USER ACTION AREA: Sort Mode Tabs ===== -->
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">User selects sort mode</text>

  <!-- Tab: Active (highlighted) -->
  <rect x="155" y="80" width="130" height="30" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" class="pulse-card"/>
  <text x="220" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">🔥 Active</text>

  <!-- Tab: People -->
  <rect x="300" y="80" width="130" height="30" rx="13" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="365" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a5b4fc">👥 People</text>

  <!-- Tab: Newest -->
  <rect x="445" y="80" width="130" height="30" rx="13" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="510" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a5b4fc">🆕 Newest</text>

  <!-- Tab: All -->
  <rect x="590" y="80" width="100" height="30" rx="13" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="640" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a5b4fc">All</text>

  <!-- Arrow: Tabs → Server -->
  <path class="flow-arrow" d="M450 115 L450 145" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- ===== SERVER PROCESSING AREA ===== -->
  <rect x="120" y="150" width="660" height="170" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="450" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Hub API</text>
  <text x="450" y="193" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">/api/hub?sort=active</text>

  <!-- Sub-box: ActivityTracker -->
  <rect x="160" y="210" width="270" height="90" rx="12" fill="#1e2035" stroke="#6366f1" stroke-width="1"/>
  <text x="295" y="237" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">ActivityTracker</text>
  <text x="295" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">5-minute sliding window</text>
  <text x="295" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Counts relay events per room</text>
  <text x="295" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Max 10,000 records/room</text>

  <!-- Dash-flow connection line -->
  <line x1="430" y1="255" x2="470" y2="255" stroke="#8b5cf6" stroke-width="2" class="dash-line"/>

  <!-- Sub-box: Sort & Page -->
  <rect x="475" y="210" width="270" height="90" rx="12" fill="#1e2035" stroke="#8b5cf6" stroke-width="1"/>
  <text x="610" y="237" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Sort &amp; Page</text>
  <text x="610" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Order by score descending</text>
  <text x="610" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Paginate (20 per page)</text>
  <text x="610" y="293" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Inject online count</text>

  <!-- Arrow: Server → Results -->
  <path class="flow-arrow" d="M450 325 L450 355" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- ===== RESULT AREA: Sorted Room Cards ===== -->
  <text x="450" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Sorted room list returned to client</text>

  <!-- Room Card A -->
  <rect x="120" y="388" width="200" height="72" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" class="pulse-card"/>
  <text x="220" y="413" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Room A</text>
  <rect x="170" y="422" width="100" height="22" rx="11" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="220" y="437" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">🔥 45 events</text>

  <!-- Room Card B -->
  <rect x="345" y="388" width="200" height="72" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="445" y="413" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Room B</text>
  <rect x="395" y="422" width="100" height="22" rx="11" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="445" y="437" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a5b4fc">🔥 32 events</text>

  <!-- Room Card C -->
  <rect x="570" y="388" width="200" height="72" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="670" y="413" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Room C</text>
  <rect x="620" y="422" width="100" height="22" rx="11" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="670" y="437" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a5b4fc">🔥 12 events</text>

  <!-- ===== BOTTOM INFO BAR ===== -->
  <rect x="120" y="478" width="660" height="32" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>

  <!-- Online indicator -->
  <circle cx="165" cy="494" r="5" fill="#22c55e" class="online-dot"/>
  <text x="185" y="499" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#86efac">N people online</text>

  <!-- Divider -->
  <line x1="330" y1="483" x2="330" y2="505" stroke="#374151" stroke-width="1"/>

  <!-- Window info -->
  <text x="450" y="499" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">5-min sliding window</text>

  <!-- Divider -->
  <line x1="570" y1="483" x2="570" y2="505" stroke="#374151" stroke-width="1"/>

  <!-- Poll info -->
  <text x="680" y="499" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">30s auto-refresh</text>
</svg>
