<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffd700"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="#0d0d1a"/>

  <!-- Step 1: Create -->
  <rect x="30" y="40" width="150" height="120" rx="10" fill="#1a1a2e" stroke="#4a7fbf" stroke-width="1.5"/>
  <text x="105" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#4a7fbf">🔐</text>
  <text x="105" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e8e8e8">Create Room</text>
  <text x="105" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Generate AES-256 key</text>
  <text x="105" y="130" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Get share code</text>

  <!-- Arrow 1→2 -->
  <path d="M185 100 L220 100" stroke="#ffd700" stroke-width="2" marker-end="url(#aw)"/>

  <!-- Step 2: Share -->
  <rect x="225" y="40" width="150" height="120" rx="10" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="300" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#22c55e">📤</text>
  <text x="300" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e8e8e8">Share Key</text>
  <text x="300" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">QR code / copy-paste</text>
  <text x="300" y="130" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Secure side channel</text>

  <!-- Arrow 2→3 -->
  <path d="M380 100 L415 100" stroke="#ffd700" stroke-width="2" marker-end="url(#aw)"/>

  <!-- Step 3: Chat -->
  <rect x="420" y="40" width="150" height="120" rx="10" fill="#1a1a2e" stroke="#ffd700" stroke-width="1.5"/>
  <text x="495" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#ffd700">💬</text>
  <text x="495" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e8e8e8">E2EE Chat</text>
  <text x="495" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Messages encrypted</text>
  <text x="495" y="130" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Server sees nothing</text>

  <!-- Arrow 3→4 -->
  <path d="M575 100 L610 100" stroke="#ffd700" stroke-width="2" marker-end="url(#aw)"/>

  <!-- Step 4: Gone -->
  <rect x="615" y="40" width="150" height="120" rx="10" fill="#1a1a2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="690" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#ef4444">💨</text>
  <text x="690" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e8e8e8">Self-Destruct</text>
  <text x="690" y="115" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Everyone leaves →</text>
  <text x="690" y="130" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Room destroyed forever</text>

  <!-- Bottom tagline -->
  <text x="400" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">No signup • No history • No trace • Zero knowledge</text>
</svg>
