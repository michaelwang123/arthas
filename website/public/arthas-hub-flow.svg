<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#0f1019"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2f45"/>
      <stop offset="100%" stop-color="#1e2035"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Arthas Hub — Public Room Directory Flow</text>

  <!-- ===== CREATOR FLOW (top) ===== -->
  <text x="450" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Room Creator</text>

  <!-- Step 1: Home -->
  <rect x="30" y="95" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="110" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">🏠</text>
  <text x="110" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Home Page</text>
  <text x="110" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Enter nickname</text>

  <!-- Arrow 1→2 -->
  <path d="M190 135 L230 135" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <defs><marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6366f1"/></marker></defs>

  <!-- Step 2: Toggle Public -->
  <rect x="235" y="95" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="315" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">🌐</text>
  <text x="315" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Toggle "Public"</text>
  <text x="315" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Set title, tags</text>

  <!-- Arrow 2→3 -->
  <path d="M395 135 L435 135" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Step 3: Create Room -->
  <rect x="440" y="95" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="520" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">🚀</text>
  <text x="520" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Create Room</text>
  <text x="520" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Room + key generated</text>

  <!-- Arrow 3→4 -->
  <path d="M600 135 L640 135" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Step 4: Listed in Hub -->
  <rect x="645" y="95" width="220" height="80" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="755" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">✅</text>
  <text x="755" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22c55e">Listed in Arthas Hub</text>
  <text x="755" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Visible to all visitors</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="50" y1="210" x2="850" y2="210" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="380" y="200" width="140" height="20" rx="4" fill="#1a1b2e"/>
  <text x="450" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6366f1">GET /api/hub (30s poll)</text>

  <!-- ===== VISITOR FLOW (bottom) ===== -->
  <text x="450" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Room Visitor (stranger)</text>

  <!-- Step A: Home -->
  <rect x="30" y="270" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="110" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">🏠</text>
  <text x="110" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Home Page</text>
  <text x="110" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Click "Browse Hub"</text>

  <!-- Arrow A→B -->
  <path d="M190 310 L230 310" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <defs><marker id="arrowViolet" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8b5cf6"/></marker></defs>

  <!-- Step B: Hub Page -->
  <rect x="235" y="270" width="190" height="80" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="330" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">🌐</text>
  <text x="330" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Arthas Hub</text>
  <text x="330" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Browse / Search / Filter</text>

  <!-- Arrow B→C -->
  <path d="M425 310 L465 310" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- Step C: Pick Room -->
  <rect x="470" y="270" width="160" height="80" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="550" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">👆</text>
  <text x="550" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Pick a Room</text>
  <text x="550" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Enter nickname → Join</text>

  <!-- Arrow C→D -->
  <path d="M630 310 L670 310" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- Step D: Chat -->
  <rect x="675" y="270" width="190" height="80" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="770" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24">💬</text>
  <text x="770" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#22c55e">E2EE Chat</text>
  <text x="770" y="341" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Fully encrypted messages</text>

  <!-- ===== KEY FEATURES BOX ===== -->
  <rect x="50" y="390" width="800" height="110" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <text x="450" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Hub Features</text>

  <!-- Feature badges -->
  <rect x="80" y="430" width="140" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="150" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a5b4fc">🔍 Search &amp; Filter</text>

  <rect x="240" y="430" width="130" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="305" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a5b4fc">🏷️ Tag Badges</text>

  <rect x="390" y="430" width="140" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="460" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a5b4fc">👥 Live Members</text>

  <rect x="550" y="430" width="130" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="615" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a5b4fc">🔒 Password Opt</text>

  <rect x="700" y="430" width="130" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="765" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a5b4fc">⏱️ Expiry Timer</text>

  <rect x="80" y="466" width="180" height="26" rx="13" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="170" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#86efac">🚫 No signup required</text>

  <rect x="280" y="466" width="200" height="26" rx="13" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="380" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#86efac">🗑️ Auto-remove on empty</text>

  <rect x="500" y="466" width="180" height="26" rx="13" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="590" y="483" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#86efac">📊 Max 200 rooms cap</text>
</svg>
