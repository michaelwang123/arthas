<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthas - 离线</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#111827; color:#fff; font-family:system-ui,-apple-system,sans-serif; }
    .card { text-align:center; padding:2rem; }
    .icon { font-size:3rem; margin-bottom:1rem; }
    h1 { font-size:1.25rem; margin:0 0 0.5rem; }
    p { color:#9ca3af; font-size:0.875rem; margin:0 0 1.5rem; }
    button { padding:0.625rem 1.5rem; background:#4f46e5; color:#fff; border:none;
             border-radius:0.5rem; font-size:0.875rem; cursor:pointer; }
    button:hover { background:#4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>网络连接已断开</h1>
    <p>请检查网络连接后重试</p>
    <button onclick="location.reload()">刷新页面</button>
  </div>
</body>
</html>
