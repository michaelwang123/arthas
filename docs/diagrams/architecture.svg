<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff9500"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7fbf"/>
      <stop offset="100%" style="stop-color:#2d5aa0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#0d0d1a"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#ffd700">Arthas System Architecture</text>

  <!-- Web Client Box -->
  <rect x="40" y="60" width="260" height="200" rx="10" fill="#1a1a2e" stroke="#4a7fbf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#4a7fbf">🌐 Web Client</text>
  <rect x="60" y="100" width="100" height="32" rx="6" fill="#1e293b"/>
  <text x="110" y="121" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">React 18</text>
  <rect x="180" y="100" width="100" height="32" rx="6" fill="#1e293b"/>
  <text x="230" y="121" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Zustand</text>
  <rect x="60" y="145" width="220" height="32" rx="6" fill="#1e293b"/>
  <text x="170" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffd700">🔒 AES-256-GCM + Ed25519</text>
  <rect x="60" y="190" width="220" height="32" rx="6" fill="#1e293b"/>
  <text x="170" y="211" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">WebSocket + MessagePack</text>

  <!-- CLI Client Box -->
  <rect x="40" y="290" width="260" height="180" rx="10" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#22c55e">🖥️ CLI Client (Go)</text>
  <rect x="60" y="330" width="100" height="32" rx="6" fill="#1e293b"/>
  <text x="110" y="351" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Terminal UI</text>
  <rect x="180" y="330" width="100" height="32" rx="6" fill="#1e293b"/>
  <text x="230" y="351" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">CSP Model</text>
  <rect x="60" y="375" width="220" height="32" rx="6" fill="#1e293b"/>
  <text x="170" y="396" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffd700">🔒 AES-256-GCM (stdlib)</text>
  <rect x="60" y="420" width="220" height="32" rx="6" fill="#1e293b"/>
  <text x="170" y="441" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">WebSocket + MessagePack</text>

  <!-- Server Box -->
  <rect x="380" y="140" width="250" height="260" rx="10" fill="#1a1a2e" stroke="url(#gold-grad)" stroke-width="2" filter="url(#shadow)"/>
  <text x="505" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffd700">⚡ Go Server (Blind Relay)</text>
  <rect x="400" y="185" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="505" y="208" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Hub (Connection Pool)</text>
  <rect x="400" y="230" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="505" y="253" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">RoomManager (Routing)</text>
  <rect x="400" y="275" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="505" y="298" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Static (Go Embed SPA)</text>
  <rect x="400" y="320" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="505" y="343" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">WebSocket Upgrader</text>

  <!-- Zero Knowledge Badge -->
  <rect x="410" y="370" width="190" height="24" rx="12" fill="rgba(255,215,0,0.15)" stroke="#ffd700" stroke-width="1"/>
  <text x="505" y="387" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffd700">❌ Cannot decrypt messages</text>

  <!-- AI Agent Box -->
  <rect x="700" y="150" width="170" height="150" rx="10" fill="#1a1a2e" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="785" y="176" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#a855f7">🤖 AI Agent</text>
  <rect x="715" y="190" width="140" height="28" rx="6" fill="#1e293b"/>
  <text x="785" y="209" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">OpenClaw Channel</text>
  <rect x="715" y="225" width="140" height="28" rx="6" fill="#1e293b"/>
  <text x="785" y="244" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffd700">🔒 AES-256-GCM</text>
  <rect x="715" y="260" width="140" height="28" rx="6" fill="#1e293b"/>
  <text x="785" y="279" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">Node.js SDK</text>

  <!-- Arrows: Web Client → Server -->
  <path d="M300 170 L375 230" stroke="#4a7fbf" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="330" y="188" font-family="monospace" font-size="9" fill="#64748b">WSS / TLS 1.3</text>

  <!-- Arrows: CLI → Server -->
  <path d="M300 380 L375 320" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="320" y="365" font-family="monospace" font-size="9" fill="#64748b">WSS / TLS 1.3</text>

  <!-- Arrows: Server → AI Agent -->
  <path d="M630 250 L700 240" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="645" y="235" font-family="monospace" font-size="9" fill="#64748b">WSS</text>

  <!-- Ciphertext labels on arrows -->
  <rect x="315" y="194" width="65" height="18" rx="4" fill="rgba(255,215,0,0.1)"/>
  <text x="347" y="207" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffd700">ciphertext</text>
  <rect x="315" y="340" width="65" height="18" rx="4" fill="rgba(255,215,0,0.1)"/>
  <text x="347" y="353" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffd700">ciphertext</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7fbf"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Footer legend -->
  <rect x="40" y="485" width="12" height="12" rx="3" fill="#4a7fbf"/>
  <text x="58" y="496" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Web Client</text>
  <rect x="150" y="485" width="12" height="12" rx="3" fill="#22c55e"/>
  <text x="168" y="496" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">CLI Client</text>
  <rect x="260" y="485" width="12" height="12" rx="3" fill="#ffd700"/>
  <text x="278" y="496" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Server (Relay Only)</text>
  <rect x="420" y="485" width="12" height="12" rx="3" fill="#a855f7"/>
  <text x="438" y="496" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">AI Agent</text>
  <text x="580" y="496" font-family="Inter, sans-serif" font-size="10" fill="#64748b">All clients use same E2EE protocol — fully interoperable</text>
</svg>
