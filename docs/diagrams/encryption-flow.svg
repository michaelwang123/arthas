<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" fill="none">
  <defs>
    <linearGradient id="eg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff9500"/>
    </linearGradient>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffd700"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <style>
      @keyframes enc-dash { to { stroke-dashoffset: -18; } }
      @keyframes enc-glow { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 5px rgba(255,215,0,0.4))} }
      .enc-arrow { stroke-dasharray: 6 3; animation: enc-dash 1.5s linear infinite; }
      .enc-highlight { animation: enc-glow 2.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .enc-arrow,.enc-highlight { animation: none; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="12" fill="#0d0d1a"/>
  <text x="450" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#ffd700">End-to-End Encryption Flow</text>

  <!-- Sender side -->
  <rect x="30" y="60" width="230" height="270" rx="10" fill="#1a1a2e" stroke="#4a7fbf" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="145" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#4a7fbf">👤 Sender (Alice)</text>

  <!-- Step 1: plaintext -->
  <rect x="50" y="100" width="190" height="34" rx="6" fill="#1e293b"/>
  <text x="145" y="121" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e8e8">① "Hello Bob!" (plaintext)</text>

  <!-- Step 2: generate IV -->
  <rect x="50" y="145" width="190" height="34" rx="6" fill="#1e293b"/>
  <text x="145" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">② Random IV (12 bytes)</text>

  <!-- Step 3: encrypt -->
  <rect class="enc-highlight" x="50" y="190" width="190" height="40" rx="6" fill="rgba(255,215,0,0.1)" stroke="#ffd700" stroke-width="1"/>
  <text x="145" y="207" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffd700">③ AES-256-GCM Encrypt</text>
  <text x="145" y="222" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">roomKey + IV + plaintext</text>

  <!-- Step 4: send ciphertext -->
  <rect x="50" y="243" width="190" height="34" rx="6" fill="#1e293b"/>
  <text x="145" y="264" text-anchor="middle" font-family="monospace" font-size="10" fill="#ef4444">④ {iv, ciphertext} →</text>

  <!-- Key badge -->
  <rect x="55" y="290" width="180" height="24" rx="12" fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="1"/>
  <text x="145" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">🔑 roomKey stays local</text>

  <!-- Server (middle) -->
  <rect x="330" y="120" width="240" height="160" rx="10" fill="#1a1a2e" stroke="#ffd700" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="450" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffd700">⚡ Server (Blind Relay)</text>

  <rect x="350" y="160" width="200" height="34" rx="6" fill="#1e293b"/>
  <text x="450" y="181" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Receives: {iv, ciphertext}</text>

  <rect x="350" y="205" width="200" height="34" rx="6" fill="rgba(239,68,68,0.1)" stroke="#ef4444" stroke-width="1"/>
  <text x="450" y="226" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ef4444">❌ Cannot decrypt</text>

  <rect x="350" y="250" width="200" height="34" rx="6" fill="#1e293b"/>
  <text x="450" y="271" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Forwards: {iv, ciphertext}</text>

  <!-- Receiver side -->
  <rect x="640" y="60" width="230" height="270" rx="10" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5" filter="url(#sh2)"/>
  <text x="755" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#22c55e">👤 Receiver (Bob)</text>

  <!-- Step 5: receive -->
  <rect x="660" y="100" width="190" height="34" rx="6" fill="#1e293b"/>
  <text x="755" y="121" text-anchor="middle" font-family="monospace" font-size="10" fill="#ef4444">⑤ ← {iv, ciphertext}</text>

  <!-- Step 6: decrypt -->
  <rect class="enc-highlight" x="660" y="145" width="190" height="40" rx="6" fill="rgba(255,215,0,0.1)" stroke="#ffd700" stroke-width="1"/>
  <text x="755" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffd700">⑥ AES-256-GCM Decrypt</text>
  <text x="755" y="177" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">roomKey + IV + ciphertext</text>

  <!-- Step 7: plaintext -->
  <rect x="660" y="198" width="190" height="34" rx="6" fill="#1e293b"/>
  <text x="755" y="219" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e8e8">⑦ "Hello Bob!" (plaintext)</text>

  <!-- Step 8: verify signature -->
  <rect x="660" y="243" width="190" height="34" rx="6" fill="rgba(168,85,247,0.1)" stroke="#a855f7" stroke-width="1"/>
  <text x="755" y="264" text-anchor="middle" font-family="monospace" font-size="10" fill="#a855f7">⑧ Ed25519 verify ✓</text>

  <!-- Key badge -->
  <rect x="665" y="290" width="180" height="24" rx="12" fill="rgba(34,197,94,0.1)" stroke="#22c55e" stroke-width="1"/>
  <text x="755" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">🔑 Same roomKey (from share code)</text>

  <!-- Flow arrows -->
  <path class="enc-arrow" d="M260 210 L330 200" stroke="#ffd700" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrG)"/>
  <path class="enc-arrow" d="M570 220 L640 170" stroke="#ffd700" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrG)"/>

  <!-- Bottom explanation -->
  <text x="450" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Key exchange happens out-of-band via share code — server never sees the encryption key</text>
</svg>
